<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="70%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Amber / Gold Glow -->
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Gradient for rings -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
  </defs>

  <!-- Dark Disc Base -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGlow)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Outer HUD Dashed Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="8 4 2 4" stroke-opacity="0.8" filter="url(#glowCyan)"/>

  <!-- Secondary Amber Segmented Arc -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#fda085" stroke-width="1.8" stroke-dasharray="24 14 6 14" stroke-opacity="0.9" filter="url(#glowAmber)"/>

  <!-- Inner Cyan Tech Ring with notches -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="16 6 8 6" filter="url(#glowCyan)"/>

  <!-- Thin inner guide -->
  <circle cx="50" cy="50" r="21" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Arc Reactor Center Core (Geometric Triangle & Circle) -->
  <polygon points="50,33 65,58 35,58" fill="none" stroke="#00f2fe" stroke-width="2.2" filter="url(#glowCyan)"/>
  <circle cx="50" cy="50" r="6" fill="#00f2fe" filter="url(#glowCyan)"/>
  <circle cx="50" cy="50" r="3" fill="#ffffff"/>

  <!-- Crosshair Tech Markers -->
  <line x1="50" y1="6" x2="50" y2="14" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="50" y1="86" x2="50" y2="94" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="6" y1="50" x2="14" y2="50" stroke="#fda085" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="86" y1="50" x2="94" y2="50" stroke="#fda085" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Corner Tech Accents -->
  <circle cx="26" cy="26" r="1.5" fill="#00f2fe"/>
  <circle cx="74" cy="26" r="1.5" fill="#fda085"/>
  <circle cx="26" cy="74" r="1.5" fill="#fda085"/>
  <circle cx="74" cy="74" r="1.5" fill="#00f2fe"/>
</svg>
